<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>View Attendance - RemaCo</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Custom CSS -->
    <link href="assets/css/custom.css" rel="stylesheet">
</head>
<body class="d-flex flex-column min-vh-100">
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="index.html">Pendataan Kehadiran RemaCo</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link" href="index.html"><i class="fas fa-home"></i> Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="view.html"><i class="fas fa-list"></i> View Attendance</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
    
    <main class="container my-4 flex-grow-1">
        <div class="row justify-content-center">
            <div class="col-12">
                <h2 class="text-center mb-3 mb-sm-4">Attendance Records</h2>
                
                <div id="message" class="mb-3"></div>
                
                <div class="card shadow mb-3 mb-sm-4">
                    <div class="card-body p-2 p-sm-3">
                        <form id="dateForm" class="row g-2 g-sm-3 align-items-end">
                            <div class="col-12 col-sm-8 col-md-9">
                                <label for="date" class="form-label">Select Date</label>
                                <select class="form-select form-select-lg" id="date" name="date" required>
                                    <!-- Dates will be populated by JavaScript -->
                                </select>
                            </div>
                            <div class="col-12 col-sm-4 col-md-3">
                                <button type="submit" class="btn btn-primary w-100 py-2">
                                    <i class="fas fa-search"></i> <span class="d-none d-sm-inline">View</span>
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
                
                <div class="card shadow">
                    <div class="card-body p-2 p-sm-3">
                        <div class="d-flex flex-column flex-sm-row justify-content-between align-items-center mb-3">
                            <h5 class="card-title mb-2 mb-sm-0" id="attendanceTitle">
                                <!-- Title will be set by JavaScript -->
                            </h5>
                            <span class="badge bg-primary rounded-pill fs-6" id="attendanceCount">
                                <!-- Count will be set by JavaScript -->
                            </span>
                        </div>
                        
                        <div id="attendanceTable">
                            <!-- Table will be populated by JavaScript -->
                            <div class="alert alert-info my-2">
                                <i class="fas fa-info-circle me-2"></i>Select a date to view attendance records.
                            </div>
                        </div>
                    </div>
                </div>
                
                <div class="mt-3 d-flex flex-column flex-sm-row justify-content-between align-items-center">
                    <div class="mb-2 mb-sm-0">
                        <a href="index.html" class="btn btn-outline-primary">
                            <i class="fas fa-plus-circle"></i> Add New Attendance
                        </a>
                    </div>
                    <div>
                        <small class="text-muted" id="lastUpdated">
                            Last updated: <span id="updateTime"></span>
                        </small>
                    </div>
                </div>
            </div>
        </div>
    </main>
    
    <footer class="bg-dark text-white py-3 mt-auto">
        <div class="container text-center">
            <p class="m-0">&copy; <span id="currentYear"></span> Pendataan Kehadiran Persekutuan RemaCo</p>
        </div>
    </footer>
    
    <!-- Bootstrap JS Bundle with Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Custom JS -->
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Set current year in footer
            document.getElementById('currentYear').textContent = new Date().getFullYear();
            
            // Update timestamp
            function updateTimestamp() {
                const now = new Date();
                document.getElementById('updateTime').textContent = now.toLocaleTimeString();
            }
            updateTimestamp();
            setInterval(updateTimestamp, 1000);
            
            // Load attendance data
            const allAttendances = JSON.parse(localStorage.getItem('attendances') || []);
            
            // Get unique dates
            const dates = [...new Set(allAttendances.map(a => a.attendance_date))].sort().reverse();
            
            // Populate date dropdown
            const dateSelect = document.getElementById('date');
            dates.forEach(date => {
                const option = document.createElement('option');
                option.value = date;
                option.textContent = new Date(date).toLocaleDateString('en-US', {
                    year: 'numeric',
                    month: 'long',
                    day: 'numeric'
                });
                dateSelect.appendChild(option);
            });
            
            // Set default to today if available
            const today = new Date().toISOString().split('T')[0];
            if (dates.includes(today)) {
                dateSelect.value = today;
            } else if (dates.length > 0) {
                dateSelect.value = dates[0];
            }
            
            // Load data for selected date
            function loadAttendanceData() {
                const selectedDate = document.getElementById('date').value;
                const filtered = allAttendances.filter(a => a.attendance_date === selectedDate);
                
                // Update title and count
                document.getElementById('attendanceTitle').textContent = 
                    `Attendance for ${new Date(selectedDate).toLocaleDateString('en-US', {
                        year: 'numeric',
                        month: 'long',
                        day: 'numeric'
                    })}`;
                
                document.getElementById('attendanceCount').textContent = 
                    `${filtered.length} member${filtered.length !== 1 ? 's' : ''}`;
                
                // Update table
                const tableContainer = document.getElementById('attendanceTable');
                
                if (filtered.length === 0) {
                    tableContainer.innerHTML = `
                        <div class="alert alert-info my-2">
                            <i class="fas fa-info-circle me-2"></i>No attendance records found for this date.
                        </div>
                    `;
                    return;
                }
                
                let tableHTML = `
                    <div class="table-responsive overflow-auto" style="max-height: 40vh;">
                        <table class="table table-striped table-hover mb-1">
                            <thead class="table-primary" style="position: sticky; top: 0; z-index: 1;">
                                <tr class="text-center">
                                    <th style="width: 10%">#</th>
                                    <th style="width: 70%">Name</th>
                                    <th style="width: 20%">Actions</th>
                                </tr>
                            </thead>
                            <tbody>
                `;
                
                filtered.forEach((record, index) => {
                    tableHTML += `
                        <tr class="text-center">
                            <td>${index + 1}</td>
                            <td style="max-width: 200px;"
                                data-bs-toggle="tooltip" data-bs-placement="top"
                                title="${escapeHtml(record.name)}">
                                ${escapeHtml(record.name)}
                            </td>
                            <td>
                                <button class="btn btn-sm btn-outline-danger delete-btn"
                                    data-id="${record.id}"
                                    data-name="${escapeHtml(record.name)}">
                                    <i class="fas fa-trash-alt"></i> <span class="d-none d-md-inline">Delete</span>
                                </button>
                            </td>
                        </tr>
                    `;
                });
                
                tableHTML += `
                            </tbody>
                        </table>
                    </div>
                `;
                
                tableContainer.innerHTML = tableHTML;
                
                // Initialize tooltips
                const tooltipList = [].slice.call(document.querySelectorAll('[data-bs-toggle="tooltip"]'));
                tooltipList.map(el => new bootstrap.Tooltip(el));
                
                // Add delete event listeners
                document.querySelectorAll('.delete-btn').forEach(btn => {
                    btn.addEventListener('click', function() {
                        const memberName = this.getAttribute('data-name');
                        const memberId = this.getAttribute('data-id');
                        
                        if (confirm(`Are you sure you want to delete "${memberName}"?`)) {
                            // Remove from data
                            const updatedAttendances = allAttendances.filter(a => a.id !== memberId);
                            localStorage.setItem('attendances', JSON.stringify(updatedAttendances));
                            
                            // Reload data
                            loadAttendanceData();
                            
                            // Show success message
                            showMessage(`"${memberName}" deleted successfully`, 'success');
                        }
                    });
                });
            }
            
            // Initial load
            if (dates.length > 0) {
                loadAttendanceData();
            }
            
            // Handle date form submission
            document.getElementById('dateForm').addEventListener('submit', function(e) {
                e.preventDefault();
                loadAttendanceData();
            });
            
            // Helper function to escape HTML
            function escapeHtml(unsafe) {
                return unsafe
                    .replace(/&/g, "&amp;")
                    .replace(/</g, "&lt;")
                    .replace(/>/g, "&gt;")
                    .replace(/"/g, "&quot;")
                    .replace(/'/g, "&#039;");
            }
            
            // Function to show messages
            function showMessage(text, type) {
                const messageDiv = document.getElementById('message');
                messageDiv.innerHTML = `<div class="alert alert-${type}">${text}</div>`;
                
                // Remove message after 3 seconds
                setTimeout(() => {
                    messageDiv.innerHTML = '';
                }, 3000);
            }
        });
    </script>
</body>
</html>
